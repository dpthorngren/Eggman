[metadata]
name = eggman
version = 0.50
author = Daniel Thorngren
author_email = dpthorngren@gmail.com
description = "Code for calculating the geometry and transit depths of piecewise ellipsoidal objects.",
url = "https://github.com/dpthorngren/Eggman"
long_description = file: README.md
license = MIT
github_project = dpthorngren/Eggman

[options]
packages = eggman
package_dir =
    =src

install_requires =
    setuptools ; python_version > "3.11"
    numpy
    cython

[options.package_data]
* =
    cy_eggman.pxd
    cy_eggman.pxi

[options.extras_require]
develop =
    pytest
    stubgen-pyx

[flake8]
max_line_length=100
max-doc-length=100
extend-ignore =
    E227
